name: Fork portable build and browser checks
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  portable:
    if: github.repository == 'Huihuing/obs-studio'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Build the portable fork
        shell: pwsh
        run: ./build-aux/fork/Build-Portable.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-fork-windows-x64
          path: build_x64/obs-fork-windows-x64-*.zip
          if-no-files-found: error
          compression-level: 0
  extension-smoke:
    if: github.repository == 'Huihuing/obs-studio'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test an unpacked extension with the pinned Linux CEF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nlohmann-json3-dev xvfb xauth libnss3 libgbm1 libasound2t64
          spec=$(jq -c '.configurePresets[] | select(.name == "dependencies") | .vendor["obsproject.com/obs-studio"].dependencies.cef' CMakePresets.json)
          version=$(jq -r .version <<< "$spec")
          revision=$(jq -r '.revision["ubuntu-x86_64"] // empty' <<< "$spec")
          file="cef_binary_${version}_linux_x86_64${revision:+_v$revision}.tar.xz"
          tmp=$(mktemp -d)
          curl --fail --location --retry 2 "$(jq -r .baseUrl <<< "$spec")/$file" -o "$tmp/cef.tar.xz"
          echo "$(jq -r '.hashes["ubuntu-x86_64"]' <<< "$spec")  $tmp/cef.tar.xz" | sha256sum --check
          mkdir "$tmp/cef"
          tar -xJf "$tmp/cef.tar.xz" --strip-components=1 -C "$tmp/cef"
          xvfb-run -a python3 plugins/obs-browser/tests/extension-smoke/run-linux.py "$tmp/cef"
