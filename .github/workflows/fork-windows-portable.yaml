name: Fork portable build and browser checks
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  portable:
    if: github.repository == 'Huihuing/obs-studio'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build the portable fork
        shell: pwsh
        run: ./build-aux/fork/Build-Portable.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-fork-windows-x64
          path: build_x64/obs-fork-windows-x64-*.zip
          if-no-files-found: error
          compression-level: 0
  windows-browser-smoke:
    if: github.repository == 'Huihuing/obs-studio'
    needs: portable
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-fork-windows-x64
          path: portable-artifact
      - name: Launch the packaged OBS and verify its Browser Sources
        shell: pwsh
        run: |
          $zip = (Get-Item portable-artifact/obs-fork-windows-x64-*.zip).FullName
          python build-aux/fork/test-portable-browser.py $zip

  extension-smoke:
    if: github.repository == 'Huihuing/obs-studio'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Test an unpacked extension with the pinned Linux CEF
        shell: bash
        run: bash plugins/obs-browser/tests/extension-smoke/ci-linux.sh CMakePresets.json
